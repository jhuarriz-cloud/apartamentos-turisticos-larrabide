<meta charset="utf-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1"
>

<title>
{{ if .IsHome }}
    Apartamentos Turísticos en Pamplona | Apartamentos Larrabide
{{ else }}
    {{ .Title }} | Apartamentos Turísticos Larrabide
{{ end }}
</title>


{{ with .Description }}

<meta
    name="description"
    content="{{ . }}"
>

{{ else }}

<meta
    name="description"
    content="Apartamentos Turísticos Larrabide en Pamplona. Alojamiento para turismo, congresos, viajes profesionales y estancias de varios días."
>

{{ end }}

<meta
    name="robots"
    content="index,follow"
>

<meta
    name="author"
    content="Apartamentos Turísticos Larrabide"
>

<meta
    name="theme-color"
    content="#0f4c81"
>

<link
    rel="canonical"
    href="{{ .Permalink }}"
>

<!-- =====================================================
     OPEN GRAPH
===================================================== -->

<meta
    property="og:title"
    content="{{ .Title }} | Apartamentos Turísticos Larrabide"
>

<meta
    property="og:description"
    content="{{ with .Description }}{{ . }}{{ else }}Apartamentos Turísticos Larrabide en Pamplona.{{ end }}"
>

<meta
    property="og:url"
    content="{{ .Permalink }}"
>

<meta
    property="og:type"
    content="website"
>

<meta
    property="og:site_name"
    content="Apartamentos Turísticos Larrabide"
>

<meta
    property="og:locale"
    content="{{ if in .RelPermalink "/en/" }}en_GB{{ else }}es_ES{{ end }}"
>

<meta
    property="og:image"
    content="{{ with .Params.hero }}{{ . | absURL }}{{ else }}{{ "/images/hero.jpg" | absURL }}{{ end }}"
>

<meta
    property="og:image:width"
    content="1200"
>

<meta
    property="og:image:height"
    content="630"
>

<meta
    property="og:image:alt"
    content="{{ .Title }}"
>

<!-- =====================================================
     TWITTER / X
===================================================== -->
<!-- =====================================================
     TWITTER / X
===================================================== -->

<meta
    name="twitter:card"
    content="summary_large_image"
>

<meta
    name="twitter:title"
    content="{{ .Title }} | Apartamentos Turísticos Larrabide"
>

<meta
    name="twitter:description"
    content="{{ with .Description }}{{ . }}{{ else }}Apartamentos Turísticos Larrabide en Pamplona.{{ end }}"
>

<meta
    name="twitter:image"
    content="{{ with .Params.hero }}{{ . | absURL }}{{ else }}{{ "/images/hero.jpg" | absURL }}{{ end }}"
>

<meta
    name="twitter:image:alt"
    content="{{ .Title }}"
>

<!-- =====================================================
     FUENTES
===================================================== -->

<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
>

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Playfair+Display:wght@600;700&display=swap"
    rel="stylesheet"
>


<!-- =====================================================
     CSS PRINCIPAL
===================================================== -->

<link
    rel="stylesheet"
    href="{{ "css/style.css" | relURL }}"
>

<link
    rel="stylesheet"
    href="{{ "css/apartments.css" | relURL }}"
>

<link
    rel="stylesheet"
    href="{{ "css/cicloturismo.css" | relURL }}"
>

<link
    rel="stylesheet"
    href="{{ "css/camino.css" | relURL }}"
>

<link
    rel="stylesheet"
    href="{{ "css/eventos.css" | relURL }}"
>

<link
    rel="stylesheet"
    href="{{ "css/congresos.css" | relURL }}"
>

<link
    rel="stylesheet"
    href="{{ "css/reservar.css" | relURL }}"
>


{{ partial "structured-data.html" . }}
