<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "LodgingBusiness",
  "@id": "{{ .Site.BaseURL }}#lodging",
  "name": "Apartamentos Turísticos Larrabide",
  "url": "{{ .Site.BaseURL }}",
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "C/ Larrabide, 3 bis",
    "addressLocality": "Pamplona",
    "addressRegion": "Navarra",
    "addressCountry": "ES"
  },
  "amenityFeature": [
    {
      "@type": "LocationFeatureSpecification",
      "name": "Wi-Fi",
      "value": true
    },
    {
      "@type": "LocationFeatureSpecification",
      "name": "Lavadora",
      "value": true
    },
    {
      "@type": "LocationFeatureSpecification",
      "name": "Cocina",
      "value": true
    },
    {
      "@type": "LocationFeatureSpecification",
      "name": "Guarda bicicletas",
      "value": true
    }
  ]
}
</script> 
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Inicio",
      "item": "{{ .Site.BaseURL }}"
    },
    {
      "@type": "ListItem",
      "position": 2,
      "name": "{{ .Title }}",
      "item": "{{ .Permalink }}"
    }
  ]
}
</script>
{{ if eq .Section "apartamentos" }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Apartment",
  "@id": "{{ .Permalink }}#apartment",
  "name": "{{ .Title }}",
  "description": "{{ .Description }}",
  "url": "{{ .Permalink }}",
  "image": "{{ .Params.hero | absURL }}",
  "numberOfBedrooms": {{ .Params.dormitorios }},
  "occupancy": {
    "@type": "QuantitativeValue",
    "maxValue": {{ .Params.capacidad }}
  },
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "C/ Larrabide, 3 bis",
    "addressLocality": "Pamplona",
    "addressRegion": "Navarra",
    "addressCountry": "ES"
  },
  "containedInPlace": {
    "@type": "LodgingBusiness",
    "@id": "{{ .Site.BaseURL }}#lodging",
    "name": "Apartamentos Turísticos Larrabide"
  },
  "sameAs": [
    "{{ .Params.booking }}",
    "{{ .Params.airbnb }}"
  ]
}
</script>
{{ if eq .Section "bike" }}
<script type="application/ld+json">
{
  "@context":"https://schema.org",
  "@type":"FAQPage",
  "mainEntity":[
    {
      "@type":"Question",
      "name":"Is the accommodation suitable for road cyclists?",
      "acceptedAnswer":{
        "@type":"Answer",
        "text":"Yes. Our apartments are ideal for road cyclists and include secure indoor bicycle storage."
      }
    },
    {
      "@type":"Question",
      "name":"Can I safely store an expensive bicycle?",
      "acceptedAnswer":{
        "@type":"Answer",
        "text":"Yes. We provide secure indoor bicycle storage for road bikes, gravel bikes, mountain bikes and e-bikes."
      }
    },
    {
      "@type":"Question",
      "name":"Is there a washing machine?",
      "acceptedAnswer":{
        "@type":"Answer",
        "text":"Yes. Every apartment includes a private washing machine."
      }
    },
    {
      "@type":"Question",
      "name":"Do the apartments have air conditioning?",
      "acceptedAnswer":{
        "@type":"Answer",
        "text":"Yes. All apartments are fully air conditioned."
      }
    },
    {
      "@type":"Question",
      "name":"Can I prepare my own meals?",
      "acceptedAnswer":{
        "@type":"Answer",
        "text":"Yes. Every apartment has a fully equipped kitchen."
      }
    },
    {
      "@type":"Question",
      "name":"Is the accommodation close to the Camino de Santiago?",
      "acceptedAnswer":{
        "@type":"Answer",
        "text":"Yes. Our apartments are conveniently located for pilgrims and cyclists travelling along the Camino."
      }
    }
  ]
}
</script>
{{ if eq .Section "bike" }}
<script type="application/ld+json">
{
  "@context":"https://schema.org",
  "@type":"ImageObject",
  "contentUrl":"{{ "/images/bike/bike-friendly-pamplona.webp" | absURL }}",
  "name":"Bike Friendly Accommodation in Pamplona",
  "description":"Secure indoor bicycle storage at Apartamentos Turísticos Larrabide in Pamplona.",
  "license":"{{ .Site.BaseURL }}"
}
</script>
{{ end }}
{{ end }}
{{ end }}
