name: Actualizar agendas de Pamplona

on:
  schedule:
    - cron: '0 6 * * *'

  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  actualizar-agendas:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Actualizar eventos
        run: |
          python scripts/actualizar_eventos.py

      - name: Actualizar conciertos de Baluarte
        run: |
          python scripts/actualizar_conciertos_baluarte.py

      - name: Actualizar congresos de Baluarte
        run: |
          python scripts/actualizar_congresos_baluarte.py

      - name: Guardar cambios y publicar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No hay cambios en las agendas."
          else
            git add content/pamplona/eventos/
            git add content/pamplona/conciertos/
            git add content/pamplona/congresos/

            git commit -m "Actualiza agendas de Pamplona"
            git push


 echo "Cambios enviados. Lanzando despliegue Hugo..."
            gh workflow run hugo.yml --ref main

          fi
