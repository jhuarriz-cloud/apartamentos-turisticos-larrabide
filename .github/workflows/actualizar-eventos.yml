name: Actualizar agendas de Pamplona

on:
  schedule:
    - cron: '0 6 * * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar-agendas:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Instalar Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser

      - name: Instalar ChromeDriver
        uses: nanasess/setup-chromedriver@master

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 selenium

      - name: Actualizar eventos
        run: |
          python scripts/actualizar_eventos.py

      - name: Actualizar conciertos de Baluarte
        run: |
          python scripts/actualizar_conciertos_baluarte.py

      - name: Actualizar congresos de Baluarte
        run: |
          python scripts/actualizar_congresos_baluarte.py

      - name: Guardar cambios y publicar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Evitar añadir por error archivos de workflows
          git reset -- .github/workflows || true

          # Si no hay cambios en el working tree, salir
          if git diff --quiet; then
            echo "No hay cambios en las agendas."
            exit 0
          fi

          # Añadir solo las rutas que queremos publicar
          git add content/pamplona/eventos/ content/pamplona/conciertos/ content/pamplona/congresos/ || true

          # Si tras añadir no hay nada staged, salir
          if git diff --cached --quiet; then
            echo "No hay cambios para commitear"
            exit 0
          fi

          git commit -m "Actualiza agendas de Pamplona" || echo "No se creó ningún commit (quizá ya estaba todo commiteado)"

          # Traer main remoto y rebase; si hay conflicto, abortar y fallar para que lo resuelvas localmente
          git fetch origin main

          if git pull --rebase origin main; then
            git push origin HEAD:main
          else
            echo "Conflicto durante rebase. Aborto — no intento resolver automáticamente en CI. Resuélvelo localmente."
            git rebase --abort || true
            exit 1
          fi
